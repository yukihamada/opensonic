<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0c0e16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="900" cy="300" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(59,130,246,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="300" cy="400" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(139,92,246,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo -->
  <circle cx="120" cy="90" r="28" stroke="url(#accent)" stroke-width="2.5" fill="none"/>
  <path d="M108 90 C108 82, 132 82, 132 90 C132 98, 108 98, 108 90" stroke="url(#accent)" stroke-width="2.5" fill="rgba(59,130,246,0.15)"/>
  <text x="160" y="100" fill="white" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="32" font-weight="700">Soluna</text>

  <!-- Main title -->
  <text x="80" y="270" fill="white" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    あなたの音楽を、
  </text>
  <text x="80" y="350" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    世界中のスピーカーへ。
  </text>

  <!-- Subtitle -->
  <text x="80" y="420" fill="#8b91a8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="24">
    オープンソース ネットワークオーディオ &#183; P2P メッシュ &#183; MIT License
  </text>

  <!-- Badges -->
  <rect x="80" y="470" width="120" height="36" rx="8" fill="rgba(59,130,246,0.12)"/>
  <text x="140" y="494" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Mac / iOS</text>

  <rect x="216" y="470" width="140" height="36" rx="8" fill="rgba(16,185,129,0.12)"/>
  <text x="286" y="494" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" text-anchor="middle">RPi / Linux</text>

  <rect x="372" y="470" width="120" height="36" rx="8" fill="rgba(6,182,212,0.12)"/>
  <text x="432" y="494" fill="#06b6d4" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Browser</text>

  <!-- Architecture nodes on the right -->
  <circle cx="900" cy="200" r="40" stroke="rgba(59,130,246,0.4)" stroke-width="2" fill="rgba(59,130,246,0.08)"/>
  <text x="900" y="210" text-anchor="middle" fill="#60a5fa" font-size="28">📡</text>
  <text x="900" y="160" text-anchor="middle" fill="#50566e" font-size="12" font-weight="600">TX</text>

  <line x1="900" y1="240" x2="820" y2="340" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="900" y1="240" x2="980" y2="340" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="900" y1="240" x2="1080" y2="300" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <circle cx="820" cy="360" r="28" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="rgba(18,21,31,0.8)"/>
  <text x="820" y="368" text-anchor="middle" fill="#8b91a8" font-size="22">📱</text>

  <circle cx="980" cy="360" r="28" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="rgba(18,21,31,0.8)"/>
  <text x="980" y="368" text-anchor="middle" fill="#8b91a8" font-size="22">🍓</text>

  <circle cx="1080" cy="310" r="28" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="rgba(18,21,31,0.8)"/>
  <text x="1080" y="318" text-anchor="middle" fill="#8b91a8" font-size="22">🌐</text>

  <!-- Bottom border accent -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>

  <!-- URL -->
  <text x="80" y="580" fill="#50566e" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18">solun.art</text>
</svg>
