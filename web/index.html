<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soluna</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <span class="logo">◈ Soluna</span>
            <div class="tx-pill" id="tx-pill">
                <span class="tx-dot" id="tx-dot"></span>
                <span id="tx-label">TX —</span>
                <span class="tx-pkts" id="tx-pkts"></span>
            </div>
        </div>
        <div class="header-right">
            <span class="ws-badge" id="ws-badge">●&nbsp;Connecting</span>
            <button class="icon-btn" id="btn-add-rx" title="Add receiver">＋</button>
        </div>
    </header>

    <main>
        <div id="rx-grid" class="rx-grid"></div>
        <div id="rx-empty" class="empty-state" style="display:none">
            <p>No receivers.<br>Click <strong>＋</strong> to add one.</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="bnav active" data-panel="dashboard">Dashboard</button>
        <button class="bnav" data-panel="browser">Browser</button>
        <button class="bnav" data-panel="routing">Routing</button>
        <button class="bnav" data-panel="stats">Stats</button>
    </nav>

    <!-- Routing panel (hidden) -->
    <div id="panel-routing" class="panel-overlay hidden">
        <div class="panel-header">
            <h2>Routing</h2>
            <button class="icon-btn close-panel">✕</button>
        </div>
        <div class="panel-body">
            <div class="route-add-row">
                <input id="route-src" placeholder="source (dev:ch)">
                <input id="route-dst" placeholder="sink (dev:ch)">
                <input id="route-gain" type="number" value="0" step="1" placeholder="dB">
                <button id="btn-route-add" class="btn">Add</button>
            </div>
            <table id="route-table">
                <thead><tr><th>Source</th><th>Sink</th><th>Gain</th><th>Muted</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Stats panel (hidden) -->
    <div id="panel-stats" class="panel-overlay hidden">
        <div class="panel-header">
            <h2>System Stats</h2>
            <button class="icon-btn close-panel">✕</button>
        </div>
        <div class="panel-body">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Devices</div><div class="stat-val" id="stat-devices">—</div></div>
                <div class="stat-card"><div class="stat-label">Streams</div><div class="stat-val" id="stat-streams">—</div></div>
                <div class="stat-card"><div class="stat-label">Routes</div><div class="stat-val" id="stat-routes">—</div></div>
                <div class="stat-card"><div class="stat-label">Bandwidth</div><div class="stat-val" id="stat-bw">—</div></div>
                <div class="stat-card"><div class="stat-label">PTP</div><div class="stat-val" id="stat-ptp">—</div></div>
                <div class="stat-card"><div class="stat-label">Offset</div><div class="stat-val" id="stat-offset">—</div></div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
