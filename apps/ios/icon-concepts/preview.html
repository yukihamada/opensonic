<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluna App Icon Concepts</title>
<style>
body { background: #0a0a12; color: #e8eaf2; font-family: -apple-system, sans-serif; padding: 40px; }
h1 { text-align: center; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px; max-width: 1200px; margin: 0 auto; }
.card { background: #12151f; border-radius: 24px; padding: 24px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
.card:hover { border-color: rgba(6,182,212,0.3); }
.card h3 { margin: 16px 0 8px; font-size: 18px; }
.card p { color: #8b91a8; font-size: 14px; }
.icon-wrap { width: 200px; height: 200px; margin: 0 auto; border-radius: 44px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
.icon-wrap svg { width: 100%; height: 100%; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Soluna App Icon Concepts</h1>
<div class="grid">

<div class="card">
<div class="icon-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a1040"/></linearGradient><linearGradient id="w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg1)"/>

  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#w1)" stroke-width="5" opacity="0.5"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#w1)" stroke-width="4" opacity="0.3"/>
  <circle cx="512" cy="512" r="50" fill="url(#w1)"/>
  <path d="M462 400 Q512 350 562 400 Q612 450 562 500 Q512 550 462 500 Q412 450 462 400" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
</svg>
</div>
<h3>1. Wave</h3>
<p>同心円の音波 + S字</p>
<span class="badge" style="background:rgba(6,182,212,0.2);color:#06b6d4;">音楽アプリ王道</span>
</div>

  <circle cx="700" cy="250" r="3" fill="white" opacity="0.5"/>

<h3>3. Sol + Luna</h3>
<p>太陽と月 — 名前の由来</p>
<span class="badge" style="background:rgba(245,158,11,0.2);color:#f59e0b;">ユニーク</span>
</div>

  <line x1="644" y1="360" x2="744" y2="480" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>
  <line x1="380" y1="360" x2="512" y2="280" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
  <line x1="644" y1="360" x2="512" y2="280" stroke="#8b5cf6" stroke-width="2" opacity="0.3"/>

</div>
