<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0020"/>
      <stop offset="50%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="sun3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="moon3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg3)"/>
  <!-- Sol (Sun) - left half -->
  <circle cx="440" cy="480" r="140" fill="url(#sun3)" opacity="0.9"/>
  <!-- Sun rays -->
  <line x1="440" y1="300" x2="440" y2="260" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="560" y1="360" x2="588" y2="332" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="320" y1="360" x2="292" y2="332" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- Luna (Moon) - overlapping right -->
  <circle cx="580" cy="520" r="140" fill="url(#moon3)" opacity="0.8"/>
  <!-- Moon crescent mask -->
  <circle cx="620" cy="490" r="100" fill="url(#bg3)" opacity="0.5"/>
  <!-- Stars -->
  <circle cx="750" cy="300" r="4" fill="white" opacity="0.6"/>
  <circle cx="800" cy="400" r="3" fill="white" opacity="0.4"/>
  <circle cx="700" cy="250" r="3" fill="white" opacity="0.5"/>
  <circle cx="850" cy="350" r="2" fill="white" opacity="0.3"/>
  <!-- Overlap glow -->
  <circle cx="510" cy="500" r="60" fill="white" opacity="0.08"/>
</svg>
