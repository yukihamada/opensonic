app = "soluna-relay"
primary_region = "nrt"

# Set secrets before first deploy:
#   fly secrets set RELAY_ADMIN_KEY="$(openssl rand -hex 16)" -a soluna-relay
#   fly secrets set RELAY_WEBHOOK_PATH="your-stripe-wh-suffix" -a soluna-relay
#   fly secrets set RELAY_CHARGE_SECRET="$(openssl rand -hex 32)" -a soluna-relay

[build]
  dockerfile = "Dockerfile"

# Multi-region: Tokyo (primary), LA, Amsterdam
# fly machine clone <machine_id> --region lax -a soluna-relay
# fly machine clone <machine_id> --region ams -a soluna-relay

# UDP relay (audio packets)
[[services]]
  internal_port = 5100
  protocol = "udp"

  [[services.ports]]
    port = 5100

# HTTP + WebSocket (force HTTP/1.1 backend for WS compat)
[http_service]
  internal_port = 5102
  force_https = true

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000

  [[http_service.checks]]
    interval = 15000
    timeout = 5000
    grace_period = "30s"
    method = "GET"
    path = "/metrics"

[mounts]
  source = "relay_data"
  destination = "/data"
