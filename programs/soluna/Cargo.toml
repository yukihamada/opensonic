[package]
name = "soluna-program"
version = "0.1.0"
edition = "2021"
description = "Soluna on-chain program: PoL + Relay Mining + Stream-to-Own"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.2"
borsh = "1.5"

[dev-dependencies]
solana-sdk = "2.2"
solana-client = "2.2"

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

[[test]]
name = "channels"
path = "tests/channels.rs"
harness = false

[[test]]
name = "indie_major"
path = "tests/indie_major.rs"
harness = false
