<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soluna Embed Player</title>
<style>
/* ── Reset & Variables ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0c0e16;
  --s2: #12151f;
  --s3: #1a1e2e;
  --border: rgba(255,255,255,0.08);
  --text: #e8eaf2;
  --text2: #8b91a8;
  --blue: #3b82f6;
  --cyan: #06b6d4;
  --purple: #8b5cf6;
  --green: #10b981;
  --grad: linear-gradient(135deg, var(--blue), var(--cyan), var(--purple));
  --grad-btn: linear-gradient(135deg, var(--blue), var(--purple));
}

:root[data-theme="light"] {
  --bg: #f8f9fc;
  --s2: #ffffff;
  --s3: #eef0f6;
  --border: rgba(0,0,0,0.08);
  --text: #1a1e2e;
  --text2: #50566e;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── Inline mode (default, max 80px) ──────────────────────── */
.player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  height: 80px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}

/* Subtle gradient border glow */
.player::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px; right: -1px; bottom: -1px;
  border-radius: 13px;
  background: var(--grad);
  opacity: 0.15;
  z-index: 0;
  pointer-events: none;
}

.player > * { position: relative; z-index: 1; }

/* ── Play button ──────────────────────────────────────────── */
.play-btn {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border: none;
  border-radius: 50%;
  background: var(--grad-btn);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}
.play-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
.play-btn:active { transform: scale(0.96); }

/* ── Info section ─────────────────────────────────────────── */
.info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex-shrink: 0;
}
.channel-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
}
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text2);
}
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text2);
  transition: background 0.3s;
}
.live-dot.active {
  background: var(--green);
  box-shadow: 0 0 6px rgba(16,185,129,0.6);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ── Waveform canvas ──────────────────────────────────────── */
.waveform-wrap {
  flex: 1;
  height: 40px;
  min-width: 60px;
}
.waveform-wrap canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ── Volume slider ────────────────────────────────────────── */
.vol-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.vol-icon {
  font-size: 14px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
}
.vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: var(--s3);
  outline: none;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--blue);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(59,130,246,0.4);
}
.vol-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--blue);
  cursor: pointer;
  border: none;
}

/* ── Powered by link ──────────────────────────────────────── */
.powered {
  position: absolute;
  bottom: 3px;
  right: 10px;
  font-size: 9px;
  color: var(--text2);
  text-decoration: none;
  opacity: 0.6;
  transition: opacity 0.2s;
  z-index: 2;
}
.powered:hover { opacity: 1; }
.powered span {
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}

/* ── Card mode ────────────────────────────────────────────── */
:root[data-mode="card"] .player {
  flex-direction: column;
  align-items: stretch;
  height: 200px;
  padding: 16px;
  gap: 12px;
}
:root[data-mode="card"] .top-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
:root[data-mode="card"] .waveform-wrap {
  height: 60px;
  flex: 1;
}
:root[data-mode="card"] .bottom-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
:root[data-mode="card"] .channel-name {
  max-width: none;
  font-size: 16px;
}
:root[data-mode="card"] .vol-wrap {
  margin-left: auto;
}
:root[data-mode="card"] .powered {
  bottom: 6px;
  right: 14px;
}

/* Inline mode layout helpers */
:root:not([data-mode="card"]) .top-row { display: contents; }
:root:not([data-mode="card"]) .bottom-row { display: contents; }

/* ── Status overlay ───────────────────────────────────────── */
.status {
  font-size: 11px;
  color: var(--text2);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="top-row">
    <button class="play-btn" id="playBtn" aria-label="Play">
      <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
      <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
    </button>
    <div class="info">
      <div class="channel-name" id="chName">channel</div>
      <div class="live-badge"><div class="live-dot" id="liveDot"></div><span id="statusText">OFFLINE</span></div>
    </div>
  </div>
  <div class="waveform-wrap">
    <canvas id="waveCanvas"></canvas>
  </div>
  <div class="bottom-row">
    <div class="vol-wrap">
      <span class="vol-icon" id="volIcon">&#x1f50a;</span>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80">
    </div>
  </div>
  <a class="powered" href="https://solun.art" target="_blank" rel="noopener">Powered by <span>Soluna</span></a>
</div>

<script>
'use strict';

// ── URL params ───────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const channel = params.get('channel') || 'soluna';
const mode    = params.get('mode')    || 'inline';
const theme   = params.get('theme')   || 'dark';

document.documentElement.setAttribute('data-theme', theme);
if (mode === 'card') document.documentElement.setAttribute('data-mode', 'card');
document.getElementById('chName').textContent = channel;

// ── IMA-ADPCM tables ────────────────────────────────────────
const STEP_TABLE = [
  7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,
  60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,
  337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,
  1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,
  5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,
  16818,18500,20350,22385,24623,27086,29794,32767
];
const INDEX_TABLE = [-1,-1,-1,-1,2,4,6,8,-1,-1,-1,-1,2,4,6,8];

// ── Audio state ──────────────────────────────────────────────
const RELAY_WS_BASE = 'wss://relay.solun.art/ws/audio';
let ws = null;
let audioCtx = null;
let gainNode = null;
let scriptNode = null;
let analyser = null;
let playing = false;
let ringBuf = new Float32Array(48000 * 4); // ~4s ring buffer
let ringW = 0;
let ringR = 0;
let helloTimer = null;

// ── Volume ───────────────────────────────────────────────────
const volSlider = document.getElementById('volSlider');
const volIcon   = document.getElementById('volIcon');
let muted = false;
let lastVol = 80;

volSlider.addEventListener('input', () => {
  if (gainNode) gainNode.gain.value = volSlider.value / 100;
  muted = false;
  updateVolIcon();
});
volIcon.addEventListener('click', () => {
  muted = !muted;
  if (muted) {
    lastVol = volSlider.value;
    volSlider.value = 0;
    if (gainNode) gainNode.gain.value = 0;
  } else {
    volSlider.value = lastVol;
    if (gainNode) gainNode.gain.value = lastVol / 100;
  }
  updateVolIcon();
});
function updateVolIcon() {
  const v = parseInt(volSlider.value);
  volIcon.textContent = v === 0 ? '\u{1F507}' : v < 50 ? '\u{1F509}' : '\u{1F50A}';
}

// ── Play / Pause ─────────────────────────────────────────────
const playBtn   = document.getElementById('playBtn');
const iconPlay  = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const liveDot   = document.getElementById('liveDot');
const statusEl  = document.getElementById('statusText');

playBtn.addEventListener('click', () => {
  if (playing) stop(); else start();
});

function start() {
  if (playing) return;
  playing = true;
  iconPlay.style.display = 'none';
  iconPause.style.display = 'block';
  statusEl.textContent = 'CONNECTING';
  initAudio();
  connectRelay();
}

function stop() {
  playing = false;
  iconPlay.style.display = 'block';
  iconPause.style.display = 'none';
  liveDot.classList.remove('active');
  statusEl.textContent = 'OFFLINE';
  disconnectRelay();
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  scriptNode = null;
  gainNode = null;
  analyser = null;
  ringW = 0;
  ringR = 0;
}

// ── AudioContext + ScriptProcessorNode ───────────────────────
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  audioCtx.resume();

  gainNode = audioCtx.createGain();
  gainNode.gain.value = volSlider.value / 100;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;

  // ScriptProcessorNode for max compatibility
  scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
  scriptNode.onaudioprocess = (e) => {
    const out = e.outputBuffer.getChannelData(0);
    const len = out.length;
    const avail = (ringW - ringR + ringBuf.length) % ringBuf.length;
    if (avail < len) {
      // Underrun — output silence
      out.fill(0);
      return;
    }
    for (let i = 0; i < len; i++) {
      out[i] = ringBuf[ringR];
      ringR = (ringR + 1) % ringBuf.length;
    }
  };

  scriptNode.connect(gainNode);
  gainNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

// ── WebSocket relay ──────────────────────────────────────────
function connectRelay() {
  const devId = 'embed-' + Math.random().toString(36).slice(2, 10);
  const url = RELAY_WS_BASE + '?channel=' + encodeURIComponent(channel) + '&device=' + encodeURIComponent(devId);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    ws.send('JOIN:' + channel + '\n');
    helloTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('HELLO\n');
    }, 5000);
    liveDot.classList.add('active');
    statusEl.textContent = 'LIVE';
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      handleChunk(evt.data);
    }
  };

  ws.onclose = () => {
    if (helloTimer) { clearInterval(helloTimer); helloTimer = null; }
    if (playing) {
      liveDot.classList.remove('active');
      statusEl.textContent = 'RECONNECTING';
      setTimeout(connectRelay, 2000);
    }
  };

  ws.onerror = () => { ws.close(); };
}

function disconnectRelay() {
  if (helloTimer) { clearInterval(helloTimer); helloTimer = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
}

// ── OSTP/RTP packet decode ───────────────────────────────────
function handleChunk(buf) {
  if (!audioCtx || !playing) return;
  const view = new DataView(buf);
  if (buf.byteLength < 12) return;

  const b0 = view.getUint8(0);
  const hasExtension = (b0 >> 4) & 0x01;
  const pt = view.getUint8(1) & 0x7F;

  let headerSize = 12; // RTP base header
  if (hasExtension) {
    headerSize += 4 + 8; // extension + OSTP header = 24 total
  }
  if (buf.byteLength <= headerSize) return;

  const payloadBuf = buf.slice(headerSize);
  let samples;

  if (pt === 116) {
    // IMA-ADPCM mono: [valprev:i16LE][index:u8][pad:u8][nibbles...]
    samples = decodeADPCM(payloadBuf);
  } else if (pt === 97) {
    // f32 LE
    samples = new Float32Array(payloadBuf);
  } else {
    // PT 96 = S32 LE (24-bit in 32-bit container)
    const dv = new DataView(payloadBuf);
    const n = (payloadBuf.byteLength / 4) | 0;
    samples = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      samples[i] = dv.getInt32(i * 4, true) / 2147483648;
    }
  }

  if (!samples || samples.length === 0) return;

  // Write to ring buffer
  for (let i = 0; i < samples.length; i++) {
    ringBuf[ringW] = samples[i];
    ringW = (ringW + 1) % ringBuf.length;
  }
}

// ── IMA-ADPCM decoder ───────────────────────────────────────
function decodeADPCM(payloadBuf) {
  const dv = new DataView(payloadBuf);
  if (payloadBuf.byteLength < 4) return null;

  let valprev = dv.getInt16(0, true);
  let index   = dv.getUint8(2);
  const nibbleStart = 4;
  const nibbleBytes = payloadBuf.byteLength - nibbleStart;
  const n = nibbleBytes * 2;
  const out = new Float32Array(n);
  let si = 0;

  for (let bi = 0; bi < nibbleBytes; bi++) {
    const b = dv.getUint8(nibbleStart + bi);
    for (let half = 0; half < 2; half++) {
      const nib = half === 0 ? (b & 0x0F) : ((b >> 4) & 0x0F);
      const step = STEP_TABLE[index];
      let diff = step >> 3;
      if (nib & 4) diff += step;
      if (nib & 2) diff += (step >> 1);
      if (nib & 1) diff += (step >> 2);
      valprev += (nib & 8) ? -diff : diff;
      if (valprev > 32767)  valprev = 32767;
      if (valprev < -32768) valprev = -32768;
      index += INDEX_TABLE[nib];
      if (index < 0)  index = 0;
      if (index > 88) index = 88;
      out[si++] = valprev / 32768;
    }
  }
  return out.subarray(0, si);
}

// ── Waveform visualization ───────────────────────────────────
const canvas = document.getElementById('waveCanvas');
const ctx2d  = canvas.getContext('2d');
let animId   = null;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width  = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  ctx2d.scale(devicePixelRatio, devicePixelRatio);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawWaveform() {
  animId = requestAnimationFrame(drawWaveform);
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx2d.clearRect(0, 0, w, h);

  if (!analyser || !playing) {
    // Idle bars
    drawIdleBars(w, h);
    return;
  }

  const bufLen = analyser.frequencyBinCount;
  const data = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(data);

  const barCount = Math.min(bufLen, Math.floor(w / 3));
  const barW = Math.max(1.5, (w / barCount) - 1);
  const gap = (w - barCount * barW) / (barCount - 1 || 1);

  // Gradient for bars
  const grad = ctx2d.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0,   getComputedStyle(document.documentElement).getPropertyValue('--blue').trim());
  grad.addColorStop(0.5, getComputedStyle(document.documentElement).getPropertyValue('--cyan').trim());
  grad.addColorStop(1,   getComputedStyle(document.documentElement).getPropertyValue('--purple').trim());
  ctx2d.fillStyle = grad;

  for (let i = 0; i < barCount; i++) {
    const val = data[i] / 255;
    const barH = Math.max(2, val * h * 0.9);
    const x = i * (barW + gap);
    const y = (h - barH) / 2;
    ctx2d.beginPath();
    ctx2d.roundRect(x, y, barW, barH, barW / 2);
    ctx2d.fill();
  }
}

function drawIdleBars(w, h) {
  const barCount = Math.floor(w / 4);
  const barW = 2;
  const gap = (w - barCount * barW) / (barCount - 1 || 1);
  ctx2d.fillStyle = theme === 'light' ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.06)';
  for (let i = 0; i < barCount; i++) {
    const x = i * (barW + gap);
    const barH = 2 + Math.sin(i * 0.3 + Date.now() * 0.001) * 3;
    const y = (h - barH) / 2;
    ctx2d.beginPath();
    ctx2d.roundRect(x, y, barW, barH, 1);
    ctx2d.fill();
  }
}

// Polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
  };
}

drawWaveform();
</script>
</body>
</html>
