server {
    listen 8080;
    root /usr/share/nginx/html;
    index landing.html;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/html application/javascript
        application/json image/svg+xml application/xml;

    # ── Security headers ───────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "no-referrer"     always;

    # ── Routes ─────────────────────────────────────────────

    # Landing page (default)
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Dashboard
    location = /dashboard {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Guide
    location = /guide {
        try_files /guide.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Install script — no caching so updates are always fresh
    location = /install.sh {
        try_files /install.sh =404;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # All other files
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML — no cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # JS / CSS — aggressive cache (7 days)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Images / fonts — long cache (30 days)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff2|woff|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
