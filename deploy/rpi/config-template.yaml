# Soluna Configuration for Raspberry Pi
# Copy to /etc/soluna/config.yaml and customize

# Stream mode
# Options:
#   sync - PTP-aligned multi-room playback (best for whole-home audio)
#   jam  - Ultra-low latency ~20ms (best for real-time jam sessions)
mode: sync

device:
  # Device name (shown in discovery)
  name: "rpi-soluna"

  # Audio device
  # Common options:
  #   "default"           - System default
  #   "hw:0"              - First ALSA card
  #   "hw:sndrpihifiberry" - HiFiBerry DAC
  #   "plughw:0"          - ALSA with conversion
  audio: "default"

  # Network interface (empty = auto)
  # interface: "eth0"

network:
  # Control API port
  control_port: 8400

  # RTP base port (streams use 5004, 5006, 5008, ...)
  rtp_base: 5004

  # Multicast addresses
  multicast_audio: "239.69.0.1"
  multicast_ptp: "224.0.1.129"

  # DSCP marking for QoS (46 = EF)
  dscp: 46

audio:
  # Sample rate in Hz
  # Options: 44100, 48000, 88200, 96000, 176400, 192000
  sample_rate: 48000

  # Number of channels
  channels: 2

  # Bit depth
  # Options: 16, 24, 32
  bit_depth: 24

  # Frames per packet (affects latency)
  # 240 (5ms) = stable on WiFi 2.4GHz (confirmed)
  # 48  (1ms) = use only on wired GbE
  frames_per_packet: 240

  # Buffer packets for jitter absorption
  # 40 packets × 5ms = 200ms ring capacity, 4-packet prefill = 20ms
  # WiFi 2.4GHz: 40 is confirmed stable (dropout-free)
  # Wired GbE:   8 is sufficient
  buffer_packets: 40

security:
  # Enable DTLS encryption (requires OpenSSL)
  dtls: false

  # Enable device authentication
  auth_enabled: false

  # Device credentials (when auth_enabled: true)
  # devices:
  #   - id: "controller"
  #     psk: "sha256:your_hashed_password"
  #     roles: [admin]

metrics:
  # Enable Prometheus metrics endpoint
  enabled: true
  port: 9100
  path: "/metrics"

logging:
  # Log level: debug, info, warn, error
  level: info

  # Log file (empty = stdout)
  file: "/var/log/soluna/daemon.log"

  # JSON format for log aggregation
  json_format: false

audit:
  # Enable audit logging
  enabled: true
  file: "/var/log/soluna/audit.jsonl"

  # Events to log (empty = all)
  # events: [auth_success, auth_failure, stream_created]

# Auto-routing rules (optional)
