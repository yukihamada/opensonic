[package]
name = "soluna-wasm"
version = "0.1.0"
edition = "2021"
description = "Soluna WASM player and transmitter for web browsers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soluna-core = { path = "../soluna-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
] }

[profile.release]
opt-level = "s"
lto = true
